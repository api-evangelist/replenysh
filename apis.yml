aid: replenysh
name: Replenysh
description: Replenysh is an enterprise circularity platform that runs circular supply chains for
  brands and recovery facilities. It routes, recovers, verifies, and optimizes material recovery flows
  across a network of 5,000+ partners, giving enterprises a single control layer for reverse logistics
  with audit-ready chain-of-custody, pricing, settlement, and compliance documentation. Customers
  include PepsiCo, Disney, Marriott, and Live Nation. Backed by Kindred Ventures and M13. Surfaced as a
  portfolio-lead stub and enriched via the API Evangelist pipeline.
